name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # `--all-features` turns on optional integrations whose build scripts
      # shell out to system libraries. Without these the build fails before it
      # reaches any Rust of ours.
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsasl2-dev libssl-dev libzstd-dev liblz4-dev zlib1g-dev libcurl4-openssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          components: rustfmt, clippy
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --check
      # Matches the framework gate: the whole target graph, warnings denied.
      - run: cargo clippy --all-targets --all-features -- -D warnings
