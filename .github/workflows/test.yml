name: Test

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # `--all-features` turns on optional integrations whose build scripts
      # shell out to system libraries. Without these the build fails before it
      # reaches any Rust of ours.
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsasl2-dev libssl-dev libzstd-dev liblz4-dev zlib1g-dev libcurl4-openssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --all-features

  msrv:
    name: MSRV 1.94.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # `--all-features` below builds librdkafka (the `kafka` feature), which
      # needs the same system libraries as the test and lint jobs.
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsasl2-dev libssl-dev libzstd-dev liblz4-dev zlib1g-dev libcurl4-openssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: msrv
      # `--all-targets` without `--all-features`: the MSRV claim is about the
      # crate as published with its defaults, not about every optional feature.
      - run: cargo check --all-targets
      # The AWS SDK dependencies are optional, so defaults alone never build them;
      # check them on the MSRV toolchain too.
      - run: cargo check --all-targets --all-features
