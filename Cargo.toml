[package]
name = "armature-messaging"
version = "0.5.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-messaging"
homepage = "https://quinnjr.github.io/armature"
description = "Message broker integrations for the Armature framework - RabbitMQ, Kafka, NATS, and AWS SQS/SNS"
keywords = ["messaging", "rabbitmq", "kafka", "nats", "sqs"]
categories = ["web-programming", "asynchronous"]

[features]
default = []
full = ["rabbitmq", "kafka", "nats", "aws"]
rabbitmq = ["lapin"]
kafka = ["rdkafka"]
nats = ["async-nats", "dep:nkeys"]
aws = ["aws-smithy-types", "aws-config", "aws-sdk-sqs", "aws-sdk-sns"]
# mq-bridge integration - provides unified messaging through mq-bridge crate
mq-bridge = ["dep:mq-bridge", "dep:anyhow"]
mq-bridge-kafka = ["mq-bridge", "mq-bridge/kafka"]
mq-bridge-amqp = ["mq-bridge", "mq-bridge/amqp"]
mq-bridge-nats = ["mq-bridge", "mq-bridge/nats"]
mq-bridge-mqtt = ["mq-bridge", "mq-bridge/mqtt"]
mq-bridge-http = ["mq-bridge", "mq-bridge/http"]
mq-bridge-full = ["mq-bridge", "mq-bridge/full"]

[dependencies]
# Core
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
futures-util = "0.3"
uuid = { version = "1.26", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# RabbitMQ
lapin = { version = "4.11", optional = true }

# Kafka
rdkafka = { version = "0.39", features = ["cmake-build"], optional = true }

# NATS
async-nats = { version = "0.50", optional = true }
nkeys = { version = "0.4", optional = true }

# SDK default features are off to drop the legacy hyper-0.14 client and its
# h2 0.3 (RUSTSEC-2026-0258); the hyper-1 `default-https-client` is kept.
# AWS SQS/SNS
aws-config = { version = "1.12", optional = true }
aws-sdk-sqs = { version = "1.109", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-sns = { version = "1.111", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }

# Held below 1.7 so a fresh resolve (Cargo.lock is not committed) picks the
# aws-sdk-*/aws-runtime releases that still build with aws-config 1.12's
# aws-smithy-json 0.63. Drop this once aws-config moves to aws-smithy-json 0.64.
aws-smithy-types = { version = ">=1.6.3, <1.7", optional = true }

# mq-bridge integration
mq-bridge = { version = "0.4", optional = true }
anyhow = { version = "1.0", optional = true }

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio-test = "0.4"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
